<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>한라대학교</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e8f0fe' stroke='%234285f4' stroke-width='3'/%3E%3Cpath d='M6 48 L26 20 L36 34 L42 27 L58 48 Z' fill='%2334a853'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div id="clock"></div>
  </header>

  <main>
    <h1 class="logo" aria-label="한라대학교">
      <svg class="emblem" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="#e8f0fe" stroke="#4285f4" stroke-width="3"/>
        <circle cx="45" cy="19" r="6" fill="#fbbc05"/>
        <path d="M6 48 L26 20 L36 34 L42 27 L58 48 Z" fill="#34a853"/>
        <path d="M26 20 L20 28.4 L24 27 L27 30 L30 26.5 Z" fill="#fff"/>
        <path d="M6 48 H58 A30 30 0 0 1 6 48 Z" fill="#4285f4"/>
      </svg>
      <span class="logo-text">
        <span style="color:#4285f4">한</span><span style="color:#ea4335">라</span><span style="color:#fbbc05">대</span><span style="color:#4285f4">학</span><span style="color:#34a853">교</span>
      </span>
    </h1>

    <form id="search-form" action="https://www.google.com/search" method="get" target="_self">
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#9aa0a6" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14"/></svg>
        <input type="text" name="q" placeholder="Google 검색 또는 URL 입력" autocomplete="off" autofocus>
      </div>
      <div class="buttons">
        <button type="submit">Google 검색</button>
        <button type="button" id="lucky">I'm Feeling Lucky</button>
      </div>
    </form>

    <section id="weather" aria-label="오늘의 날씨">
      <div class="card" data-city="원주"></div>
      <div class="card" data-city="서울"></div>
      <div class="card" data-city="제주"></div>
    </section>

    <section id="quote">
      <p id="quote-text"></p>
      <p id="quote-author"></p>
    </section>
  </main>

  <footer>오늘의 날씨 · Open-Meteo 제공</footer>
  <script src="script.js"></script>
</body>
</html>
